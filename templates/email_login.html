<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    .wrap { max-width: 420px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; }
    button { background: #198754; color: white; border: 0; border-radius: 8px; cursor: pointer; }
    a { color: #0d6efd; text-decoration: none; }
    .flash { padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .danger { background: #ffe5e5; }
    .success { background: #e7ffe7; }
    .warning { background: #fff6db; }
    .info { background: #e6f4ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Sign in</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('email_login') }}">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p>No account yet? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</body>
</html>
