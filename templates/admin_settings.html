{% extends "base.html" %}
{% set page_title = "Admin Settings" %}

{% block content %}
<div class="cardx" style="max-width: 520px; margin: 40px auto;">
  <h2 class="mb-3">Admin Settings</h2>

  <form method="POST">
    <h5 class="mt-3 mb-3" style="color: var(--primary);">Account Settings</h5>

    <div class="mb-3">
      <label class="form-label">Admin Name</label>
      <input type="text" name="username" class="form-control" value="{{ admin.username }}" required>
      <div class="form-text">The name must include "admin".</div>
    </div>

    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
    </div>

    <hr>
    <h5 class="mt-3 mb-3" style="color: var(--primary);">Shop Settings</h5>

    <div class="mb-3">
      <label class="form-label">Shop Name</label>
      <input type="text" name="shop_name" class="form-control" value="{{ admin.get('shop_name', '') }}" placeholder="e.g. Picass's Electronics">
    </div>

    <div class="mb-3">
      <label class="form-label">WhatsApp Number</label>
      <input type="text" name="whatsapp" class="form-control" value="{{ admin.get('whatsapp', '') }}" placeholder="e.g. +2348012345678">
      <div class="form-text">Include country code. Used for WhatsApp buttons on products.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Shop Phone Number</label>
      <input type="text" name="phone" class="form-control" value="{{ admin.get('phone', '') }}" placeholder="e.g. 08012345678">
    </div>

    <div class="mb-3">
      <label class="form-label">Shop Location</label>
      <input type="text" name="location" class="form-control" value="{{ admin.get('location', '') }}" placeholder="e.g. No. 5 Zik Avenue, Awka">
    </div>

    <div class="mb-3">
      <label class="form-label">Opening Hours</label>
      <input type="text" name="opening_hours" class="form-control" value="{{ admin.get('opening_hours', '') }}" placeholder="e.g. Mon-Sat 8am-6pm">
    </div>

    <div class="mb-3">
      <label class="form-label">Footer Message</label>
      <input type="text" name="footer_message" class="form-control" value="{{ admin.get('footer_message', '') }}" placeholder="e.g. Quality electronics at affordable prices">
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
</div>
{% endblock %}
